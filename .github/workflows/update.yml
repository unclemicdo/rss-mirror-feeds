name: Update feeds

on:
  schedule:
    - cron: "0 */7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate feeds
        run: python scripts/update_feeds.py

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain feeds)" ]; then
            git add feeds
            git commit -m "Update feeds $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No feed changes"
          fi
